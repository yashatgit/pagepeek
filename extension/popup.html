<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagecrawl cookies</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --muted:#6b6b76; --line:#e2e2e8; --card:#f6f6f9; --accent:#2557d6; --ok:#17803d; --bad:#c62828; }
  :root[data-theme="dark"] { --bg:#16161a; --fg:#ececf1; --muted:#9a9aa6; --line:#2d2d35; --card:#1f1f25; --accent:#6c93ff; --ok:#4cc27a; --bad:#ff7b7b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16161a; --fg:#ececf1; --muted:#9a9aa6; --line:#2d2d35; --card:#1f1f25; --accent:#6c93ff; --ok:#4cc27a; --bad:#ff7b7b; } }
  * { box-sizing: border-box; }
  body { margin:0; width:560px; height:600px; display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font:13px/1.4 -apple-system,system-ui,sans-serif; }
  header { display:flex; gap:8px; padding:10px; border-bottom:1px solid var(--line); align-items:center; }
  header input[type=search] { flex:1; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  button { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  #theme { padding:4px 7px; }
  #list { flex:1; overflow:auto; }
  .group > summary { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--card); border-bottom:1px solid var(--line); cursor:pointer; position:sticky; top:0; }
  .group .count { color:var(--muted); margin-left:auto; }
  .row { display:grid; grid-template-columns:20px 1fr auto; gap:8px; padding:4px 10px 4px 26px; border-bottom:1px solid var(--line); align-items:center; }
  .row .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .meta { color:var(--muted); font-size:11px; }
  footer { border-top:1px solid var(--line); padding:10px; display:flex; flex-direction:column; gap:8px; }
  .bar { display:flex; gap:8px; align-items:center; }
  .bar input[type=text] { width:150px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  #status { min-height:1.4em; font-size:12px; white-space:pre-wrap; }
  #status.ok { color:var(--ok); } #status.bad { color:var(--bad); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Filter by site or cookie name, e.g. amazon" autofocus>
  <button id="all" title="Tick everything that matches the filter">Tick shown</button>
  <button id="none">Clear</button>
  <button id="theme" title="Light or dark">◐</button>
</header>
<div id="list"></div>
<footer>
  <div class="bar">
    <span class="muted">File</span><input id="name" type="text" value="cookie-export-site"><span class="muted">.json</span>
    <span id="picked" class="muted" style="margin-left:auto"></span>
  </div>
  <div class="bar">
    <button id="dl">Download</button>
    <button id="save">Save to folder</button>
    <button id="send" class="primary">Send to pagecrawl</button>
  </div>
  <div id="status"></div>
</footer>
<script src="popup.js"></script>
</body>
</html>
