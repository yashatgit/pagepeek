# docker compose up -d --build
#
# Settings come from a .env file next to this one (copy .env.example). Compose reads it for
# the ${...} values below; the container itself never sees the file.
services:
  pagecrawl:
    build: .
    image: pagecrawl:latest
    container_name: pagecrawl
    restart: unless-stopped
    init: true
    shm_size: 1gb
    mem_limit: 2g
    ports:
      # Reachable from other machines on the network, so the web page works from a laptop or
      # phone. Every read still needs the token. For this machine only: "127.0.0.1:8787:8787".
      - "${PAGECRAWL_PORT:-8787}:8787"
    environment:
      PAGECRAWL_TOKEN: ${PAGECRAWL_TOKEN:?set PAGECRAWL_TOKEN in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAGECRAWL_MODEL: ${PAGECRAWL_MODEL:-}
      PAGECRAWL_HOST_GAP_MS: ${PAGECRAWL_HOST_GAP_MS:-}
      PAGECRAWL_COOKIES_DIR: /cookies
    volumes:
      # Optional. Cookie JSON files dropped here are picked up on the next read (see README).
      - ./cookiestore:/cookies:ro
